services:
  mariadb:
    image: mariadb:lts
    hostname: mariadb
    container_name: mariadb
    expose:
      - "3306"
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      # need to be consistent with slurmdbd.conf
      MYSQL_DATABASE: slurm_acct_db
      MYSQL_USER: slurm
      MYSQL_PASSWORD: password
    volumes:
      - var_lib_mysql:/var/lib/mysql
    networks:
      - slurm-network

  slurmdbd:
    image: slurmdbd-debian
    command: ["slurmdbd"]
    container_name: slurmdbd
    hostname: slurmdbd
    volumes:
      - ./config/slurm-cluster1:/etc/slurm
      - var_log_slurm1:/var/log/slurm
    expose:
      - "6819"
    depends_on:
      - "mariadb"
    networks:
      - slurm-network

  slurmctld-cluster1:
    image: slurmctld-debian
    command: ["slurmctld"]
    container_name: slurmctld-cluster1
    hostname: slurmctld-cluster1
    volumes:
      - ./config/slurm-cluster1:/etc/slurm
      - slurm_jobdir:/data
      - var_log_slurm1:/var/log/slurm
    expose:
      - "6817"
    depends_on:
      - "slurmdbd"
    networks:
      - slurm-network

  cmpt1-cluster1:
    image: slurmd-debian
    command: ["slurmd"]
    hostname: cmpt1-cluster1
    container_name: cmpt1-cluster1
    volumes:
      - ./config/slurm-cluster1:/etc/slurm
      - slurm_jobdir:/data
      - var_log_slurm1:/var/log/slurm
    expose:
      - "6818"
    depends_on:
      - "slurmctld-cluster1"
    networks:
      - slurm-network

  cmpt2-cluster1:
    image: slurmd-debian
    command: ["slurmd"]
    hostname: cmpt2-cluster1
    container_name: cmpt2-cluster1
    volumes:
      - ./config/slurm-cluster1:/etc/slurm
      - slurm_jobdir:/data
      - var_log_slurm1:/var/log/slurm
    expose:
      - "6818"
    depends_on:
      - "slurmctld-cluster1"
    networks:
      - slurm-network

  slurmctld-cluster2:
    image: slurmctld-debian
    command: ["slurmctld"]
    container_name: slurmctld-cluster2
    hostname: slurmctld-cluster2
    volumes:
      - ./config/slurm-cluster2:/etc/slurm
      - slurm_jobdir:/data
      - var_log_slurm2:/var/log/slurm
    expose:
      - "6817"
    depends_on:
      - "slurmdbd"
    networks:
      - slurm-network

  cmpt1-cluster2:
    image: slurmd-debian
    command: ["slurmd"]
    hostname: cmpt1-cluster2
    container_name: cmpt1-cluster2
    volumes:
      - ./config/slurm-cluster2:/etc/slurm
      - slurm_jobdir:/data
      - var_log_slurm2:/var/log/slurm
    expose:
      - "6818"
    depends_on:
      - "slurmctld-cluster2"
    networks:
      - slurm-network

  cmpt2-cluster2:
    image: slurmd-debian
    command: ["slurmd"]
    hostname: cmpt2-cluster2
    container_name: cmpt2-cluster2
    volumes:
      - ./config/slurm-cluster2:/etc/slurm
      - slurm_jobdir:/data
      - var_log_slurm2:/var/log/slurm
    expose:
      - "6818"
    depends_on:
      - "slurmctld-cluster2"
    networks:
      - slurm-network

volumes:
  slurm_jobdir:
  var_lib_mysql:
  var_log_slurm1:
  var_log_slurm2:

networks:
  slurm-network:
    driver: bridge
